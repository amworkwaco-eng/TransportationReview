name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    name: JavaScript syntax check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate inline JavaScript
        run: |
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            const html = fs.readFileSync('index.html', 'utf8');
            const matches = [...html.matchAll(/<script(?![^>]*src=)[^>]*>([\\s\\S]*?)<\\/script>/g)];
            if (matches.length === 0) {
              console.error('No inline scripts found in index.html');
              process.exit(1);
            }
            console.log('Found', matches.length, 'inline script block(s)');
            for (const [i, m] of matches.entries()) {
              try {
                new vm.Script(m[1]);
                console.log('Block ' + (i+1) + ': syntax OK (' + m[1].length + ' chars)');
              } catch (e) {
                console.error('Block ' + (i+1) + ' SYNTAX ERROR:', e.message);
                process.exit(1);
              }
            }
            console.log('All inline JavaScript syntactically valid.');
          "

      - name: Check file is well-formed UTF-8
        run: |
          if ! iconv -f UTF-8 -t UTF-8 index.html > /dev/null 2>&1; then
            echo "ERROR: index.html is not valid UTF-8"
            exit 1
          fi
          echo "UTF-8 encoding OK"

      - name: Check for CRLF line endings
        run: |
          if grep -lU $'\r' index.html > /dev/null 2>&1; then
            echo "WARNING: index.html contains CRLF line endings — should be LF"
            echo "Fix with: sed -i 's/\r$//' index.html"
            exit 1
          fi
          echo "Line endings OK (LF)"

      - name: Report file size
        run: |
          size=$(stat -c%s index.html)
          size_kb=$(( size / 1024 ))
          echo "index.html: ${size} bytes (${size_kb} KB)"
          if [ $size -gt 5242880 ]; then
            echo "WARNING: index.html exceeds 5 MB; GitHub Pages may render slowly"
          fi
